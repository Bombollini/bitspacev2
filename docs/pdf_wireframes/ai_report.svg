    <!-- AI Report content -->
    <text x="30" y="155" font-family="Arial" font-size="10" fill="black">Berikut adalah analisis status proyek "Pengembangan Aplikasi Bitspace":</text><text x="30" y="183" font-family="Arial" font-size="10" fill="black">1. **Progress Keseluruhan**: Proyek berjalan sesuai rencana dengan 45% penyelesaian pada phase 1.</text><text x="30" y="201" font-family="Arial" font-size="10" fill="black">2. **Task yang Harus Diperhatikan**:</text><text x="30" y="219" font-family="Arial" font-size="10" fill="black">   - API Authentication (priority: High, due: 25/07/2024)</text><text x="30" y="237" font-family="Arial" font-size="10" fill="black">   - Integrasi Gemini AI (priority: High, due: 30/07/2024)</text><text x="30" y="255" font-family="Arial" font-size="10" fill="black">3. **Rekomendasi**:</text><text x="30" y="273" font-family="Arial" font-size="10" fill="black">   - Percepat development pada API Authentication</text><text x="30" y="291" font-family="Arial" font-size="10" fill="black">   - Lakukan meeting untuk membahas detail integrasi AI</text><text x="30" y="309" font-family="Arial" font-size="10" fill="black">4. **Kesimpulan**: Proyek dalam kondisi sehat, namun perlu perhatian pada task dengan priority tinggi.</text>
    
    
